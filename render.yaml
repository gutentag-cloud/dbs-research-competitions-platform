services:
  - type: web
    name: dbs-partner-pilot
    runtime: docker
    plan: starter
    healthCheckPath: /api/session
    envVars:
      - key: PILOT_ORIGIN
        sync: false
      - key: PILOT_DATA_DIR
        value: /var/data/pilot
    disk:
      name: pilot-data
      mountPath: /var/data
      sizeGB: 1
